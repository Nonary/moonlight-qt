name: Publish qualified Moonlight nightly
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: daily-prerelease
  cancel-in-progress: false
jobs:
  publish-qualified:
    if: inputs.publish && github.repository == 'Nonary/moonlight-qt' && vars.DAILY_RELEASE_ENABLED == 'true' && vars.DAILY_RELEASE_SOURCE_BRANCH == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Nonary/moonlight-qt
      SOURCE_SHA: f07197712fe7afefe3d8eb85a1e68a678d8fcecc
      QUALIFIED_RUN: '38176935263'
      CI_VERSION: 6.2.0-daily.184
      DAILY_TAG: v6.2.0-daily.184
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f07197712fe7afefe3d8eb85a1e68a678d8fcecc
          fetch-depth: 0
      - name: Require exact completed qualification and preserved source
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$(git ls-remote origin refs/heads/master | cut -f1)" == "$SOURCE_SHA" ]]
          gh api "repos/$GH_REPO/actions/runs/$QUALIFIED_RUN" > qualified-run.json
          gh api "repos/$GH_REPO/actions/runs/$QUALIFIED_RUN/jobs?per_page=100" > qualified-jobs.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('qualified-run.json'))
          assert r['head_sha']==os.environ['SOURCE_SHA'] and r['status']=='completed' and r['conclusion']=='success'
          jobs=json.load(open('qualified-jobs.json'))['jobs']
          expected={'prepare','linux / build','flatpak / build','windows / build (windows-2025, 6.11.1)','windows / build (macos-26, 6.11.1)'}
          assert {j['name'] for j in jobs if j['conclusion']=='success'}==expected
          PY
          for sha in a04581d62341adc406292fc99e397c8ce4d50df7 1020cfe3a9bf5cd13a242340022bfbd5167ad247 cfa5003120aaeeb733576f1de8140d3d605ddf38 5b062c4bddf641fdd2b669beba77c69b5a65b068 3c32553e5a8cba3d43eb41bfc49a0e260270175d 2083d82a166ddecc18df551cc5df0ee2f983cc52; do
            git merge-base --is-ancestor "$sha" "$SOURCE_SHA"
          done
      - uses: actions/download-artifact@v6
        with:
          name: Moonlight-Windows-Release-6.2.0-daily.184
          path: release-assets
          github-token: ${{ github.token }}
          repository: Nonary/moonlight-qt
          run-id: 38176935263
      - uses: actions/download-artifact@v6
        with:
          name: Moonlight-macOS-6.2.0-daily.184
          path: release-assets
          github-token: ${{ github.token }}
          repository: Nonary/moonlight-qt
          run-id: 38176935263
      - uses: actions/download-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-6.2.0-daily.184
          path: release-assets
          github-token: ${{ github.token }}
          repository: Nonary/moonlight-qt
          run-id: 38176935263
      - uses: actions/download-artifact@v6
        with:
          name: Moonlight-Flatpak-6.2.0-daily.184
          path: release-assets
          github-token: ${{ github.token }}
          repository: Nonary/moonlight-qt
          run-id: 38176935263
      - name: Verify archive integrity and actual Windows product version
        run: |
          python3 - <<'PY'
          import os, struct, zipfile
          from pathlib import Path
          root=Path('release-assets');v=os.environ['CI_VERSION']
          expected={f'MoonlightSetup-{v}.exe',f'MoonlightPortable-x64-{v}.zip',f'Moonlight-{v}.dmg',f'Moonlight-{v}-x86_64.AppImage',f'Moonlight-{v}-x86_64.flatpak'}
          assert {p.name for p in root.iterdir()}==expected
          assert all(p.is_file() and not p.is_symlink() and p.stat().st_size>0 for p in root.iterdir())
          with zipfile.ZipFile(root/f'MoonlightPortable-x64-{v}.zip') as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if n.lower().endswith('moonlight.exe')];assert len(names)==1
              exe=z.read(names[0]);needle=struct.pack('<I',0xfeef04bd)
              offsets=[i for i in range(len(exe)) if exe.startswith(needle,i)]
              versions=[struct.unpack_from('<6I',exe,i) for i in offsets if i+24<=len(exe)]
              assert any(x[1]==0x10000 and x[4]==(6<<16|2) and x[5]==(184<<16) for x in versions),versions
          with (root/f'Moonlight-{v}.dmg').open('rb') as f:
              f.seek(-512,2);assert f.read(4)==b'koly'
          with (root/f'Moonlight-{v}-x86_64.AppImage').open('rb') as f:
              h=f.read(16);assert h[:4]==b'\x7fELF' and h[8:11]==b'AI\x02'
          with (root/f'Moonlight-{v}-x86_64.flatpak').open('rb') as f:assert f.read(8)==b'flatpak\x00'
          with (root/f'MoonlightSetup-{v}.exe').open('rb') as f:assert f.read(2)==b'MZ'
          print('PASS five intact qualified packages; actual Windows product 6.2.184.0')
          PY
      - name: Generate established notes and immutable metadata
        run: |
          set -euo pipefail
          git fetch origin --tags
          python3 - <<'PY'
          import importlib.util, os, subprocess
          spec=importlib.util.spec_from_file_location('daily','scripts/daily-version.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.next_version(subprocess.check_output(['git','tag','--list'],text=True).splitlines())==os.environ['CI_VERSION']
          PY
          : > release-notes.md
          python3 scripts/nightly_notes.py --repo "$GH_REPO" --tag "$DAILY_TAG" --version "$CI_VERSION" --source "$SOURCE_SHA" --assets release-assets --notes release-notes.md
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('release-notes.md');s=p.read_text()
          limit='Intel NT-handle interoperability was probed on UHD 770; Arc B390 end-to-end playback remains unverified. Steam Deck native Wayland and GPU hold were verified; optical HDR/VRR output remains unverified.'
          p.write_text(s.replace('### Linux installation',limit+'\n\n### Linux installation'))
          m=json.load(open('release-assets/nightly-metadata.json'))
          assert m['source_commit']==os.environ['SOURCE_SHA'] and m['nightly_sequence']==184 and m['windows_product_version']=='6.2.184'
          assert m['previous_successful_tag']=='v6.2.0-daily.183' and m['commits_total']==m['commits_listed']==21
          assert len(m['artifacts'])==5 and all(a['source_commit']==os.environ['SOURCE_SHA'] for a in m['artifacts'])
          PY
          (cd release-assets && sha256sum --check SHA256SUMS)
          if gh release view "$DAILY_TAG" >/dev/null 2>&1; then
            echo 'Immutable release already exists; refusing replacement' >&2
            exit 1
          fi
      - name: Create draft and upload complete unsigned package set
        run: |
          set -euo pipefail
          gh release create "$DAILY_TAG" --target "$SOURCE_SHA" --draft --prerelease --latest=false --title "Moonlight daily $CI_VERSION" --notes-file release-notes.md
          gh release upload "$DAILY_TAG" release-assets/*
      - name: Redownload and verify before publishing
        run: |
          set -euo pipefail
          mkdir verified-assets
          gh release download "$DAILY_TAG" --dir verified-assets
          (cd verified-assets && sha256sum --check SHA256SUMS)
          diff -qr release-assets verified-assets
          git fetch origin --tags
          gh release view "$DAILY_TAG" --json isDraft,isPrerelease,targetCommitish,tagName > draft-release.json
          python3 - <<'PY'
          import importlib.util,json,os,subprocess
          spec=importlib.util.spec_from_file_location('daily','scripts/daily-version.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          tags=subprocess.check_output(['git','tag','--list'],text=True).splitlines();tag=os.environ['DAILY_TAG']
          tag_sha=subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip() if tag in tags else None
          m.verify_draft(json.load(open('draft-release.json')),os.environ['SOURCE_SHA'],tag,tag_sha)
          assert m.next_version([t for t in tags if t!=tag])==os.environ['CI_VERSION']
          PY
          gh release edit "$DAILY_TAG" --draft=false --prerelease --latest=false
          gh release view "$DAILY_TAG" --json url,isDraft,isPrerelease,targetCommitish,assets > published-release.json
          echo 'Published exact-source nightly after complete upload and download verification.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: Moonlight-publication-proof-6.2.0-daily.184
          path: |
            qualified-run.json
            qualified-jobs.json
            draft-release.json
            published-release.json
            release-notes.md
            release-assets/nightly-metadata.json
            release-assets/SHA256SUMS
