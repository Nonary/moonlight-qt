name: Build release artifacts
permissions:
  contents: read

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      ci_version:
        description: Release version without the leading v
        required: true
        type: string
      build_macos:
        description: Include the macOS build
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      ci_version: ${{ steps.version.outputs.ci_version }}
    steps:
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.ci_version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#release/}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-vrr[0-9]+(\.[0-9]+)?$ ]]
          echo "ci_version=$version" >> "$GITHUB_OUTPUT"

  windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      build_macos: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}

  appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  flatpak:
    needs: setup
    runs-on: ubuntu-22.04
    env:
      CI_VERSION: ${{ needs.setup.outputs.ci_version }}
      CCACHE_DIR: ${{ github.workspace }}/.flatpak-builder/ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Flatpak build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder org.kde.Sdk//6.10 org.kde.Platform//6.10
      - name: Detect Flatpak build resources and SDK identity
        id: flatpak-sdk
        run: |
          python3 -m unittest discover -s scripts/tests -p test_linux_build_budget.py
          python3 scripts/linux-build-budget.py
          { printf '%s\n' "$ImageOS" "$ImageVersion"; uname -m; flatpak --version; flatpak info --user --show-commit org.flatpak.Builder; flatpak info --user --show-commit org.kde.Sdk//6.10; flatpak info --user --show-commit org.kde.Platform//6.10; } > flatpak-sdk-fingerprint.txt
          flatpak run --command=ccache org.kde.Sdk//6.10 --version
          echo "abi=$(sha256sum flatpak-sdk-fingerprint.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore SDK and manifest keyed compiler cache
        id: flatpak-ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .flatpak-builder/ccache
          key: flatpak-ccache-v1-${{ runner.arch }}-${{ steps.flatpak-sdk.outputs.abi }}-${{ hashFiles('packaging/flatpak/**', 'app/deploy/linux/appimage/*.patch', '.github/workflows/build-release.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-ccache-v1-${{ runner.arch }}-${{ steps.flatpak-sdk.outputs.abi }}-${{ hashFiles('packaging/flatpak/**', 'app/deploy/linux/appimage/*.patch', '.github/workflows/build-release.yml') }}-
      - name: Pin manifest to release source and version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('packaging/flatpak/com.moonlight_stream.Moonlight.json')
          manifest = json.loads(path.read_text())
          for dependency in manifest['modules']:
              for source in dependency.get('sources', []):
                  if source.get('type') == 'patch':
                      original = (path.parent / source['path']).resolve()
                      staged = path.parent / original.name
                      staged.write_bytes(original.read_bytes())
                      source['path'] = staged.name
          module = next(m for m in manifest['modules'] if m['name'] == 'moonlight')
          module['sources'][0]['commit'] = os.environ['GITHUB_SHA']
          module['sources'][1]['commands'] = ['echo ' + os.environ['CI_VERSION'] + ' > app/version.txt']
          path.write_text(json.dumps(manifest, indent=4) + '\n')
          PY
      - name: Build Flatpak
        run: |
          dbus-run-session -- flatpak run --env=CCACHE_DIR="$CCACHE_DIR" --env=CCACHE_MAXSIZE=512M org.flatpak.Builder --user --force-clean --sandbox --ccache --jobs="$BUILD_JOBS" --rebuild-on-sdk-change \
            --install-deps-from=flathub --repo=flatpak-repo flatpak-build \
            packaging/flatpak/com.moonlight_stream.Moonlight.json
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "Moonlight-VRR-$CI_VERSION-linux-x86_64.flatpak" \
            com.moonlight_stream.Moonlight master
      - name: Verify exported source and Gamescope patch
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('flatpak-build/files/manifest.json').read_text())
          modules = {m['name']: m for m in manifest['modules']}
          assert modules['moonlight']['sources'][0]['commit'] == os.environ['GITHUB_SHA']
          assert any(s['type'] == 'patch' and 'libplacebo-disable-internally-synchronized-queues.patch' in s['path'] for s in modules['libplacebo']['sources'])
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Flatpak-${{ env.CI_VERSION }}
          path: Moonlight-VRR-${{ env.CI_VERSION }}-linux-x86_64.flatpak
          compression-level: 0
          if-no-files-found: error
      - name: Save verified Flatpak compiler cache
        if: success() && (github.ref_name == github.event.repository.default_branch || (github.repository == 'Nonary/moonlight-qt' && github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')) && steps.flatpak-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .flatpak-builder/ccache
          key: ${{ steps.flatpak-ccache.outputs.cache-primary-key }}
