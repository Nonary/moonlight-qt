---
name: Build - Linux AppImage
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ci_version:
        description: Version string used for the release artifact
        required: true
        type: string
      source_ref:
        description: Exact source commit (defaults to the dispatched ref)
        required: false
        type: string
        default: ''

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
      CC: ccache gcc
      CXX: ccache g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 512M
      DEP_STAGE: ${{ github.workspace }}/dependency-install
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            elf_machine: Advanced Micro Devices X86-64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            elf_machine: AArch64
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Enforce GitHub-hosted daily builds
        if: contains(inputs.ci_version, '-daily.')
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: test "$RUNNER_ENVIRONMENT" = 'github-hosted'

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: 'recursive'
          fetch-depth: 1

      - name: Add the LunarG Vulkan SDK repository (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list
          echo 'VULKAN_PACKAGES=vulkan-sdk' >> "$GITHUB_ENV"

      - name: Setup environment
        run: |
          # aarch64 has no LunarG SDK: libvulkan-dev gives the loader, and Vulkan-Headers
          # plus shaderc are built from source below with the other dependencies.
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-declarative-dev qt6-wayland qt6-wayland-dev libqt6waylandclient6 libqt6waylandcompositor6 libwayland-dev weston libdecor-0-dev libqt6svg6-dev qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript qml6-module-qtqml-models qml6-module-qtquick-window qml6-module-qtquick python3-pip nasm libgbm-dev libdrm-dev libfreetype-dev libasound2-dev \
            libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev libibus-1.0-dev libpulse-dev libudev-dev libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev libxt-dev libxv-dev libxxf86vm-dev libxcb-dri3-dev libx11-xcb-dev \
            libxfixes-dev libxtst-dev wayland-protocols libopus-dev libvdpau-dev libgl-dev libpipewire-0.3-dev liburing-dev libvulkan-dev libfuse2 xvfb cmake ccache ${VULKAN_PACKAGES:-}
          sudo pip3 install meson
          mkdir -p dep_root/{bin,include,lib}
          echo "DEP_ROOT=$PWD/dep_root" >> "${GITHUB_ENV}"
          echo "$PWD/dep_root/bin" >> "${GITHUB_PATH}"

      - name: Detect build resources and dependency ABI
        id: toolchain
        run: |
          python3 -m unittest discover -s scripts/tests -p test_linux_build_budget.py
          python3 scripts/linux-build-budget.py
          # The exact cache key includes the runner image, installed package ABI,
          # compiler/linker/build tool versions, dependency refs and patches.
          { printf '%s\n' "$ImageOS" "$ImageVersion"; dpkg-query -W; gcc --version; g++ --version; ld --version; cmake --version; meson --version; ninja --version; } > toolchain-fingerprint.txt
          # Include the resolved IDs behind version tags, not only their names.
          for dependency in 'sdl https://github.com/libsdl-org/SDL.git release-3.4.12' 'sdlcompat https://github.com/libsdl-org/sdl2-compat.git release-2.32.70' 'libva https://github.com/intel/libva.git 2.24.1' 'ffmpeg https://github.com/FFmpeg/FFmpeg.git n8.1.1' 'dav1d https://code.videolan.org/videolan/dav1d.git 1.5.3' 'vulkanheaders https://github.com/KhronosGroup/Vulkan-Headers.git vulkan-sdk-1.4.313.0' 'shaderc https://github.com/google/shaderc.git v2025.2'; do
            read -r name repository tag <<< "$dependency"
            refs=$(git ls-remote "$repository" "refs/tags/$tag" "refs/tags/$tag^{}")
            test -n "$refs"
            printf '%s\n%s\n' "$repository" "$refs" >> toolchain-fingerprint.txt
            sha=$(awk '{print $1}' <<< "$refs" | tail -n 1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            echo "$name=$sha" >> "$GITHUB_OUTPUT"
          done
          echo "abi=$(sha256sum toolchain-fingerprint.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore exact dependency install
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dependency-install
          key: appimage-deps-wayland-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('.github/workflows/build-appimage.yml', 'scripts/build-appimage.sh', 'app/deploy/linux/appimage/*.patch') }}

      - name: Install restored dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: |
          test -s "$DEP_STAGE/usr/local/lib/libSDL3.so.0"
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: appimage-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('.github/workflows/build-appimage.yml', 'scripts/build-appimage.sh', 'app/deploy/linux/appimage/*.patch') }}-${{ github.sha }}
          restore-keys: |
            appimage-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.abi }}-${{ hashFiles('.github/workflows/build-appimage.yml', 'scripts/build-appimage.sh', 'app/deploy/linux/appimage/*.patch') }}-

      - name: Checkout Vulkan-Headers (aarch64)
        if: matrix.arch == 'aarch64'
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ steps.toolchain.outputs.vulkanheaders }}
          path: deps/Vulkan-Headers

      - name: Build Vulkan-Headers (aarch64)
        if: matrix.arch == 'aarch64' && steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/Vulkan-Headers
        run: |
          # Ubuntu 22.04 ships Vulkan 1.3.204 headers; FFmpeg's Vulkan hwaccel needs 1.3.277+
          # and this matches the LunarG SDK 1.4.313 used on x86_64. Header-only install.
          cmake -DCMAKE_BUILD_TYPE=Release -S . -B build
          DESTDIR="$DEP_STAGE" cmake --install build
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Checkout shaderc (aarch64)
        if: matrix.arch == 'aarch64'
        uses: actions/checkout@v5
        with:
          repository: google/shaderc
          ref: ${{ steps.toolchain.outputs.shaderc }}
          path: deps/shaderc

      - name: Build shaderc (aarch64)
        if: matrix.arch == 'aarch64' && steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/shaderc
        run: |
          # libplacebo compiles its shaders with shaderc (preferred over glslang); on x86_64
          # the LunarG SDK provides it. git-sync-deps fetches the pinned glslang/SPIRV-Tools.
          python3 utils/git-sync-deps
          cmake -DCMAKE_BUILD_TYPE=Release -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DSHADERC_ENABLE_SHARED_CRT=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -S . -B build
          cmake --build build --parallel "$BUILD_JOBS"
          DESTDIR="$DEP_STAGE" cmake --install build
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/
          sudo ldconfig
          pkg-config --modversion shaderc

      - name: Checkout SDL3
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          ref: ${{ steps.toolchain.outputs.sdl }}
          path: deps/SDL

      - name: Build SDL3
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/SDL
        run: |
          cmake -DSDL_WAYLAND=ON -DSDL_KMSDRM=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_INSTALL_DOCS=OFF -DCMAKE_BUILD_TYPE=Release '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -flto=1' '-DCMAKE_SHARED_LINKER_FLAGS=-flto=1' -S . -B build
          cmake --build build --parallel "$BUILD_JOBS"
          DESTDIR="$DEP_STAGE" cmake --install build
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Checkout sdl2-compat
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/sdl2-compat
          ref: ${{ steps.toolchain.outputs.sdlcompat }}
          path: deps/sdl2-compat

      - name: Build sdl2-compat
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/sdl2-compat
        run: |
          cmake -DSDL2COMPAT_TESTS=OFF -DCMAKE_BUILD_TYPE=Release '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -flto=1' '-DCMAKE_SHARED_LINKER_FLAGS=-flto=1' -S . -B build
          cmake --build build --parallel "$BUILD_JOBS"
          DESTDIR="$DEP_STAGE" cmake --install build
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/
          # sdl2-compat installs only sdl2-compat.pc, while Moonlight and SDL_ttf ask pkg-config
          # for sdl2. The x86_64 runner image happens to satisfy that from a system package; on
          # aarch64 nothing does, so alias the pkg-config name to sdl2-compat (staged for the cache).
          if ! pkg-config --exists sdl2; then
            ln -s sdl2-compat.pc "$DEP_STAGE/usr/local/lib/pkgconfig/sdl2.pc"
            sudo ln -s sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc
            pkg-config --modversion sdl2
          fi

      - name: Checkout SDL_ttf
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL_ttf
          ref: a883e490e30fb44a5336ea3dcb990c6982c5216f
          path: deps/SDL_ttf
          submodules: 'recursive'

      - name: Build SDL_ttf
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/SDL_ttf
        run: |
          ./autogen.sh
          ./configure
          make -j"$BUILD_JOBS"
          make DESTDIR="$DEP_STAGE" install
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Checkout libva
        uses: actions/checkout@v5
        with:
          repository: intel/libva
          ref: ${{ steps.toolchain.outputs.libva }}
          path: deps/libva

      - name: Build libva
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/libva
        run: |
          ./autogen.sh
          ./configure --enable-x11
          make -j"$BUILD_JOBS"
          make DESTDIR="$DEP_STAGE" install
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Checkout libplacebo
        uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: 2d0979fb54e025e904c7372666fffbf5dae40f66
          path: deps/libplacebo
          submodules: 'recursive'

      - name: Build libplacebo
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/libplacebo
        run: |
          git apply ../../app/deploy/linux/appimage/*.patch
          meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false
          ninja -j "$BUILD_JOBS" -C build
          DESTDIR="$DEP_STAGE" ninja -j "$BUILD_JOBS" install -C build
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Build dav1d
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps
        env:
          DAV1D_VER: 1.5.3
        run: |
          git clone --branch $DAV1D_VER --depth 1 https://code.videolan.org/videolan/dav1d.git
          pushd dav1d
          test "$(git rev-parse HEAD)" = '${{ steps.toolchain.outputs.dav1d }}'
          meson setup build -Ddefault_library=static -Dbuildtype=release -Denable_tools=false -Denable_tests=false
          ninja -j "$BUILD_JOBS" -C build
          DESTDIR="$DEP_STAGE" ninja -j "$BUILD_JOBS" install -C build
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/
          popd

      - name: Checkout FFmpeg
        uses: actions/checkout@v5
        with:
          repository: FFmpeg/FFmpeg
          ref: ${{ steps.toolchain.outputs.ffmpeg }}
          path: deps/FFmpeg

      - name: Build FFmpeg
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: deps/FFmpeg
        run: |
          ./configure --enable-pic --enable-lto=1 --disable-static --enable-shared --disable-all --disable-autodetect \
            --enable-avcodec --enable-avformat --enable-swscale \
            --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=av1 \
            --enable-vaapi --enable-hwaccel=h264_vaapi --enable-hwaccel=hevc_vaapi --enable-hwaccel=av1_vaapi \
            --enable-vdpau --enable-hwaccel=h264_vdpau  --enable-hwaccel=hevc_vdpau --enable-hwaccel=av1_vdpau \
            --enable-libdrm --enable-vulkan --enable-hwaccel=h264_vulkan --enable-hwaccel=hevc_vulkan --enable-hwaccel=av1_vulkan \
            --enable-libdav1d --enable-decoder=libdav1d
          make -j"$BUILD_JOBS"
          make DESTDIR="$DEP_STAGE" install
          sudo cp -a "$DEP_STAGE/usr/local/." /usr/local/

      - name: Install linuxdeploy
        working-directory: dep_root/bin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build Binaries
        run: |
          sudo ldconfig
          python3 -m unittest discover -s scripts/tests -p test_amdgpu_header_compat.py
          g++ -std=c++17 -fsyntax-only -Iapp/streaming scripts/linux-gpu-capability.cpp
          scripts/build-appimage.sh

      - name: Test nightly updater and DualSense haptics
        if: contains(inputs.ci_version, '-daily.')
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p build/nightly-tests-updates build/nightly-tests-haptics build/nightly-tests-steamcontroller
          (cd build/nightly-tests-updates && qmake6 ../../tests/updates/updates.pro CONFIG+=release && make -j"$BUILD_JOBS" && ./tst_autoupdatechecker)
          (cd build/nightly-tests-haptics && qmake6 ../../tests/haptics/haptics.pro CONFIG+=release && make -j"$BUILD_JOBS" && ./tst_dualsensehaptics)
          (cd build/nightly-tests-steamcontroller && qmake6 ../../tests/steamcontroller/steamcontroller.pro CONFIG+=release && make -j"$BUILD_JOBS" && ./tst_steamcontroller)
          mkdir -p build/nightly-tests-feedback build/nightly-tests-present build/nightly-tests-gpu
          (cd build/nightly-tests-feedback && qmake6 ../../tests/vrr/waylandfeedback.pro && make -j"$BUILD_JOBS" && ./tst_waylandfeedback)
          (cd build/nightly-tests-present && qmake6 ../../tests/vrr/plvkpresentation.pro && make -j"$BUILD_JOBS" && ./tst_plvkpresentation)
          (cd build/nightly-tests-gpu && qmake6 ../../tests/vrr/gpuperformancehold.pro && make -j"$BUILD_JOBS" && ./tst_gpuperformancehold)
          bash scripts/test-linux-integration.sh qmake6

      - name: Verify nightly AppImage payload and embedded version
        if: contains(inputs.ci_version, '-daily.')
        timeout-minutes: 5
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/build/installer-release/Moonlight-$CI_VERSION-${{ matrix.arch }}.AppImage"
          test -s "$image"
          chmod +x "$image"
          mkdir "$RUNNER_TEMP/nightly-appimage"
          cd "$RUNNER_TEMP/nightly-appimage"
          "$image" --appimage-extract > extract.log
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/moonlight
          readelf -h squashfs-root/usr/bin/moonlight | grep -F '${{ matrix.elf_machine }}'
          LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" python3 "$GITHUB_WORKSPACE/scripts/verify-linux-features.py" --root "$PWD/squashfs-root" --host-wayland
          # Exercise the packaged X11 plugin; offscreen is intentionally not bundled.
          QT_QPA_PLATFORM=xcb xvfb-run -a squashfs-root/AppRun --version > version.txt
          grep -Fx "Moonlight $CI_VERSION" version.txt
          bash "$GITHUB_WORKSPACE/scripts/smoke-linux-wayland.sh" "$PWD/squashfs-root/AppRun" --version > wayland-version.txt
          grep -Fx "Moonlight $CI_VERSION" wayland-version.txt

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-LinuxAppImage-${{ matrix.arch }}-${{ env.CI_VERSION }}
          path: build/installer-release/Moonlight-${{ env.CI_VERSION }}-${{ matrix.arch }}.AppImage
          compression-level: 0
          if-no-files-found: error

      - name: Save verified dependency install
        if: success() && (github.ref_name == github.event.repository.default_branch || (github.repository == 'Nonary/moonlight-qt' && github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')) && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dependency-install
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Report compiler cache
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: success() && (github.ref_name == github.event.repository.default_branch || (github.repository == 'Nonary/moonlight-qt' && github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')) && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
