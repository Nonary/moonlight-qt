name: Build - Windows and macOS
on:
  workflow_dispatch:
    inputs:
      ci_version:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      build_macos:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  calibration-probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
          cache: true
      - name: Compile calibration selection fixture only
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`scripts\vswhere.exe -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          mkdir build\qml-probe
          cd build\qml-probe
          qmake ..\..\tests\qml\calibration-hosts.pro CONFIG+=release
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
      - name: Run unchanged calibration assertions with matching SDK runtime
        shell: pwsh
        env:
          QML_IMPORT_PATH: ${{ github.workspace }}\..\Qt\6.11.1\msvc2022_64\qml
          QML2_IMPORT_PATH: ${{ github.workspace }}\..\Qt\6.11.1\msvc2022_64\qml
          QT_PLUGIN_PATH: ${{ github.workspace }}\..\Qt\6.11.1\msvc2022_64\plugins
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $sdk = "$env:QT_ROOT_DIR/bin"
          $stage = Join-Path $env:RUNNER_TEMP 'deployed-qt-probe'
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($dll in @('Qt6Core.dll', 'Qt6Network.dll', 'Qt6Qml.dll', 'Qt6QmlModels.dll')) {
            Copy-Item "$sdk/$dll" $stage
          }
          $env:Path = "$stage;$sdk;$env:Path"
          $imports = $env:QML_IMPORT_PATH
          $plugins = $env:QT_PLUGIN_PATH
          Remove-Item Env:QML_IMPORT_PATH, Env:QML2_IMPORT_PATH, Env:QT_PLUGIN_PATH
          $before = Join-Path $env:RUNNER_TEMP 'calibration-original.txt'
          & ./build/qml-probe/release/tst_calibrationhosts.exe -o "$before,txt"
          $originalExit = $LASTEXITCODE
          Write-Host "Original deployed-DLL runtime exit: $originalExit"
          Get-Content $before
          $env:QML_IMPORT_PATH = $imports
          $env:QML2_IMPORT_PATH = $imports
          $env:QT_PLUGIN_PATH = $plugins
          $after = Join-Path $env:RUNNER_TEMP 'calibration-fixed.txt'
          & ./build/qml-probe/release/tst_calibrationhosts.exe -o "$after,txt"
          $fixedExit = $LASTEXITCODE
          Get-Content $after
          if ($fixedExit -ne 0) { throw "Calibration assertions failed: $fixedExit" }
